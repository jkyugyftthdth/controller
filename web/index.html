<!doctype html>
<html lang="en" data-layout="car"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070d24"><title>Forza Controller</title>
<link rel="stylesheet" href="/static/style.css"></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="s-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
 <symbol id="s-o" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></symbol>
 <symbol id="s-sq" viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="1"/></symbol>
 <symbol id="s-tri" viewBox="0 0 24 24"><path d="M12 4.5l8 14H4z"/></symbol>
</svg>
<header id="bar"><span id="dot"></span><span><b id="ms">--</b> ms</span>
 <div id="lay" role="group" aria-label="Layout"><button data-l="car">CAR</button><button data-l="pad">PAD</button></div>
 <span class="sp"></span>
 <button id="cal" class="carOnly">Calibrate</button><button id="info" aria-label="Info">&#9432;</button><button id="gear" aria-label="Settings">&#9881;</button></header>
<main>
 <!-- LEFT: L2 / L1 / left stick / D-pad -->
 <section id="left" class="side">
  <div class="r1">
   <button class="hold trg brk" data-k="brk"><b class="carOnly">BRAKE</b><b class="padOnly">L2</b><small>LT</small></button>
   <button class="hold bmp" data-k="lb">L1</button>
  </div>
  <div class="r2">
   <div class="dpad">
    <button class="hold d up" data-k="up">&#9650;</button>
    <button class="hold d lf" data-k="left">&#9664;</button>
    <button class="hold d rt" data-k="right">&#9654;</button>
    <button class="hold d dn" data-k="down">&#9660;</button>
   </div>
   <div class="stick" id="ls"><i></i><small>L</small></div>
  </div>
 </section>

 <!-- CENTRE: car = wheel + tilt bar; pad = brand panel. Both: Create / PS / Options -->
 <section id="zone">
  <div class="carOnly cwrap">
   <div id="wheel"><svg viewBox="0 0 100 100" fill="none" stroke-linecap="round"><circle cx="50" cy="50" r="42" stroke-width="10"/><path d="M10 50h80M50 50v40" stroke-width="8"/><rect x="45" y="3" width="10" height="13" class="mark" rx="2"/></svg></div>
   <div id="sbar"><i id="sbi"></i></div>
   <p id="hint">Tilt the phone like a steering wheel</p>
  </div>
  <div class="padOnly cwrap"><div id="lightbar"></div><p class="brand">FORZA CONTROLLER</p>
   <div class="row3"><button class="hold sm" data-k="l3">L3</button><button class="hold sm" data-k="r3">R3</button></div></div>
  <div class="mid"><button class="hold sm" data-k="back">CREATE</button><button class="hold sm ps" data-k="guide">PS</button><button class="hold sm" data-k="start">OPTIONS</button></div>
 </section>

 <!-- RIGHT: R2 / R1 / face buttons / right stick -->
 <section id="right" class="side">
  <div class="r1">
   <button class="hold bmp" data-k="rb">R1</button>
   <button class="hold trg acc" data-k="acc"><b class="carOnly">ACCELERATE</b><b class="padOnly">R2</b><small>RT</small></button>
  </div>
  <div class="r2">
   <div class="abxy">
    <button class="hold f fy" data-k="y"><svg class="sym"><use href="#s-tri"/></svg><small class="carOnly">REWIND</small></button>
    <button class="hold f fx" data-k="x"><svg class="sym"><use href="#s-sq"/></svg><small class="carOnly">NITROS</small></button>
    <button class="hold f fb" data-k="b"><svg class="sym"><use href="#s-o"/></svg></button>
    <button class="hold f fa" data-k="a"><svg class="sym"><use href="#s-x"/></svg><small class="carOnly">HANDBRAKE</small></button>
   </div>
   <div class="stick" id="rs"><i></i><small>R</small></div>
  </div>
 </section>
</main>

<div id="cfg" class="ov hide"><div class="card"><h1>SETTINGS</h1>
 <label>Steering (car layout) <select id="c-mode"><option value="gyro">Gyro (tilt)</option><option value="touch">Touch strip</option></select></label>
 <label>Full lock at (deg) <span id="c-rangev"></span><input id="c-range" type="range" min="15" max="90" step="5"></label>
 <label>Sensitivity <span id="c-steerv"></span><input id="c-steer" type="range" min="0.5" max="2" step="0.1"></label>
 <label>Deadzone % <span id="c-dzv"></span><input id="c-dz" type="range" min="0" max="20" step="1"></label>
 <label>Invert steering <input id="c-inv" type="checkbox"></label>
 <label>Vibration <input id="c-hap" type="checkbox"></label>
 <div class="row"><button id="fs">Fullscreen</button><button id="disc">Disconnect</button></div>
 <button id="cfgx">Close</button></div></div>

<div id="start" class="ov"><div class="card"><h1>FORZA CONTROLLER</h1>
 <input id="host" class="appOnly" inputmode="decimal" placeholder="PC address (e.g. 192.168.1.20)" autocomplete="off">
 <input id="pin" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" autocomplete="off">
 <button id="go" class="big">CONNECT</button><p id="msg"></p></div></div>
<div id="rot" class="ov">Rotate your phone to landscape</div>
<script src="/static/app.js"></script></body></html>
