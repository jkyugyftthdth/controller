plugins {
    id 'com.android.application'
}

android {
    namespace 'com.forzacontroller.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.forzacontroller.app'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // the app shows exactly the same controller page the PC serves: web/ is packed into the APK
    sourceSets {
        main { assets.srcDirs = ['../../web'] }
    }
}
