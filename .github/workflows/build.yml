name: Build portable EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (vgamepad unpacked by hand, no driver installer)
        shell: pwsh
        run: |
          # vgamepad's pip install runs the ViGEmBus installer, which waits for a click and hangs CI.
          # The driver is only needed on the player's PC, so just unpack the library files.
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^vgamepad' } | Set-Content req-ci.txt
          pip install -r req-ci.txt pyinstaller
          $meta = Invoke-RestMethod https://pypi.org/pypi/vgamepad/0.1.0/json
          $file = $meta.urls | Sort-Object { $_.packagetype -ne 'bdist_wheel' } | Select-Object -First 1
          Write-Host "Downloading $($file.filename)"
          New-Item -ItemType Directory -Force dl, dl\x | Out-Null
          Invoke-WebRequest $file.url -OutFile "dl\$($file.filename)"
          if ($file.filename -like '*.whl') { Copy-Item "dl\$($file.filename)" dl\v.zip; Expand-Archive dl\v.zip dl\x -Force }
          else { tar -xzf "dl\$($file.filename)" -C dl\x }
          $pkg = Get-ChildItem dl\x -Recurse -Directory -Filter vgamepad | Where-Object { Test-Path "$($_.FullName)\__init__.py" } | Select-Object -First 1
          $sp = python -c "import site;print(site.getsitepackages()[0])"
          Copy-Item -Recurse -Force $pkg.FullName "$sp\vgamepad"
          # importing vgamepad needs the driver (absent on CI), so only check the files are there
          if (-not (Test-Path "$sp\\vgamepad\\__init__.py")) { throw 'vgamepad files missing' }
          Get-ChildItem "$sp\\vgamepad" -Recurse -Filter *.dll | Select-Object -ExpandProperty FullName
      - run: >
          pyinstaller --noconfirm --clean --onefile --noconsole --uac-admin --icon assets\icon.ico --name ForzaController
          --paths . --add-data "web;web" --collect-all qrcode --collect-all vgamepad --hidden-import vgamepad.win.virtual_gamepad --hidden-import vgamepad.win.vigem_client --hidden-import vgamepad.win.vigem_commons --hidden-import PIL.ImageTk app/main.py
      - name: Fetch ViGEmBus driver installer (bundled into the setup, optional)
        shell: pwsh
        continue-on-error: true
        run: |
          $r = Invoke-RestMethod https://api.github.com/repos/nefarius/ViGEmBus/releases/latest
          $a = $r.assets | Where-Object { $_.name -like '*.exe' } | Select-Object -First 1
          Write-Host "Bundling $($a.name)"
          Invoke-WebRequest $a.browser_download_url -OutFile installer\ViGEmBus_Setup.exe
      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup not found' }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" installer\ForzaController.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: ForzaController-installer
          path: dist/ForzaController-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ForzaController-portable
          path: dist/ForzaController.exe

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android app (debug-signed APK, installs on any Android 10+ phone)
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ForzaController.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ForzaController-android
          path: dist/ForzaController.apk

  publish:
    needs: [build, android]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ForzaController-*
          path: dist
          merge-multiple: true
      - name: Publish public download (Releases > latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest dist/* --repo "${{ github.repository }}" --title "Forza Controller - latest build" \
            --notes "Windows: ForzaController-Setup.exe (installer, recommended) or ForzaController.exe (portable). Android: ForzaController.apk. Install the ViGEmBus driver when the installer offers it."
