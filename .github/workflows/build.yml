name: Build portable EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --noconfirm --clean --onefile --noconsole --uac-admin --name ForzaController
          --paths . --add-data "web;web" --collect-all qrcode --hidden-import PIL.ImageTk app/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ForzaController-portable
          path: dist/ForzaController.exe
